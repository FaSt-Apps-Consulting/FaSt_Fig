# Test matrix across supported Python versions. pytest runs with coverage via
# [tool.pytest.ini_options] addopts in pyproject.toml.
when:
  event: [push, pull_request]
  branch: [main]

matrix:
  PYTHON_VERSION:
    - "3.12"
    - "3.13"
    - "3.14"
    # - "3.15" # Add once official uv images ship (Python 3.15 final: Oct 2026)

variables:
  - &uv-image ghcr.io/astral-sh/uv:0.12.13-python${PYTHON_VERSION}-trixie-slim

steps:
  test:
    image: *uv-image
    environment:
      # Copy instead of hardlink: workspace is a mounted volume on Codeberg runners
      UV_LINK_MODE: copy
    commands:
      - uv sync --locked
      - uv run pytest