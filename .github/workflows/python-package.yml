# This workflow will install Python dependencies, run lint and tests on a
# matrix of Python versions. Mirrors the Codeberg Woodpecker pipeline
# (.woodpecker/) using uv for installation and ruff for linting.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Install uv and set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .
    - name: Test with pytest
      run: uv run pytest