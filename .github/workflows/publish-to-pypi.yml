# Publishes sdist + wheel following the Python Packaging User Guide:
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# - Build job is separate from publishing jobs (build once, publish from artifacts).
# - Publishing uses PyPI Trusted Publishing (OIDC, no API tokens). Register the
#   publishers once at:
#     https://pypi.org/manage/account/publishing/      (Environment: pypi)
#     https://test.pypi.org/manage/account/publishing/ (Environment: testpypi)
# - For security reasons, require manual approval on each run for the "pypi"
#   environment (GitHub Settings > Environments > pypi).
# - PEP 740 attestations are generated automatically by gh-action-pypi-publish.

name: Publish Python distribution to PyPI and TestPyPI

on:
  push:
    branches: ["main"]  # build + TestPyPI on every main push
    tags: ["v*"]        # PyPI on version tags
  workflow_dispatch:    # allow manual builds

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fast-fig
    permissions:
      id-token: write  # mandatory for Trusted Publishing
      contents: read
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish distribution to TestPyPI
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fast-fig
    permissions:
      id-token: write  # mandatory for Trusted Publishing
      contents: read
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/