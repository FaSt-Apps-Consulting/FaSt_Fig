[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fast_fig"
version = "0.8.3"
description = "FaSt_Fig is a wrapper for matplotlib with templates."
authors = [
    {name = "Fabian Stutzki", email = "fast@fast-apps.de"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = ["matplotlib", "figure"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.6.0",
    "pandas>=2.1.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://www.fast-apps.de"
Repository = "https://codeberg.org/FaSt-Apps/FaSt_Fig"
Issues = "https://codeberg.org/FaSt-Apps/FaSt_Fig/issues"
Changelog = "https://codeberg.org/FaSt-Apps/FaSt_Fig/src/branch/main/CHANGELOG.md"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # Ignore 'incorrect-blank-line-before-class' in favor of D211
    "D213",  # Ignore 'multi-line-summary-second-line' in favor of D212
    "COM812",  # Ignore to avoid conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # Ignore assert statements in tests
    "PLR2004",  # Ignore magic numbers in tests
]
"fast_fig/class_ffig.py" = [
    "C901",  # set_xlim/set_ylim parameter validation; refactor candidate
    "PLR0912",  # ditto
]

[tool.ruff.lint.flake8-copyright]
author = "Fabian Stutzki"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=fast_fig --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["fast_fig"]

[tool.coverage.report]
show_missing = true
